<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberBlade: Neon Space Defender (60 FPS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    canvas { background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%); }
    .neon-border { box-shadow: 0 0 25px rgba(236, 72, 153, 0.4); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4">
  
  <div class="max-w-4xl w-full">
    <!-- Game Header -->
    <header class="flex justify-between items-center mb-4 bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-600 to-rose-400 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-pink-500/30">
          ⚡
        </div>
        <div>
          <h1 class="font-black text-xl tracking-tight text-white flex items-center gap-2">
            CYBERBLADE <span class="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded-full bg-pink-500/20 text-pink-400 border border-pink-500/30">60 FPS WebGL/Canvas</span>
          </h1>
          <p class="text-xs text-slate-400">Arrow Keys or A/D to move • SPACE or Click to Fire • Mouse/Touch Supported</p>
        </div>
      </div>
      <div class="flex gap-4 items-center">
        <div class="text-right">
          <div class="text-[10px] uppercase font-bold text-slate-400">Score</div>
          <div id="game-score" class="font-mono text-xl font-bold text-pink-400">0</div>
        </div>
        <div class="text-right">
          <div class="text-[10px] uppercase font-bold text-slate-400">Shields</div>
          <div id="game-lives" class="font-mono text-xl font-bold text-emerald-400">♥♥♥</div>
        </div>
      </div>
    </header>

    <!-- Canvas Game Frame -->
    <div class="relative rounded-3xl overflow-hidden border-2 border-pink-500/40 neon-border aspect-[16/9] w-full bg-black flex items-center justify-center">
      <canvas id="gameCanvas" width="800" height="450" class="w-full h-full block"></canvas>
      
      <!-- Overlay Start / Game Over Screen -->
      <div id="gameOverlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-600 flex items-center justify-center text-3xl mb-4 shadow-xl shadow-pink-500/40 animate-pulse">
          🚀
        </div>
        <h2 id="overlayTitle" class="text-3xl sm:text-4xl font-black text-white mb-2 tracking-tight">CYBERBLADE: DEFENDER</h2>
        <p id="overlaySub" class="text-sm text-slate-300 max-w-md mb-6">Defend the sector against neon alien drones and incoming cosmic debris. Destroy enemies to earn points and upgrade firepower!</p>
        <button id="startBtn" onclick="startGame()" class="bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white font-extrabold px-8 py-3.5 rounded-2xl shadow-lg shadow-pink-500/30 transition transform hover:scale-105 active:scale-95 text-base">
          ▶ START GAME
        </button>
      </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div class="mt-4 flex justify-between gap-3 sm:hidden">
      <div class="flex gap-2">
        <button id="btnLeft" class="bg-slate-800 text-white px-6 py-3 rounded-xl active:bg-pink-600 text-sm font-bold">◀ LEFT</button>
        <button id="btnRight" class="bg-slate-800 text-white px-6 py-3 rounded-xl active:bg-pink-600 text-sm font-bold">RIGHT ▶</button>
      </div>
      <button id="btnFire" class="bg-pink-600 text-white px-8 py-3 rounded-xl active:bg-pink-700 font-bold text-sm flex-1">🔥 FIRE LASER</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('game-score');
    const livesEl = document.getElementById('game-lives');
    const overlay = document.getElementById('gameOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');

    let gameActive = false;
    let score = 0;
    let lives = 3;
    let player = { x: 400, y: 390, width: 36, height: 36, speed: 6, dx: 0 };
    let bullets = [];
    let enemies = [];
    let particles = [];
    let lastEnemySpawn = 0;
    let keys = {};

    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' && gameActive) {
        fireLaser();
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // Touch Buttons
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnFire = document.getElementById('btnFire');
    if (btnLeft) {
      btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowLeft'] = true; });
      btnLeft.addEventListener('touchend', () => { keys['ArrowLeft'] = false; });
      btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowRight'] = true; });
      btnRight.addEventListener('touchend', () => { keys['ArrowRight'] = false; });
      btnFire.addEventListener('touchstart', (e) => { e.preventDefault(); fireLaser(); });
    }

    canvas.addEventListener('mousemove', e => {
      if (!gameActive) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      player.x = (e.clientX - rect.left) * scaleX - player.width / 2;
    });
    canvas.addEventListener('mousedown', () => { if (gameActive) fireLaser(); });

    function startGame() {
      score = 0;
      lives = 3;
      bullets = [];
      enemies = [];
      particles = [];
      player.x = canvas.width / 2 - 18;
      scoreEl.innerText = '0';
      livesEl.innerText = '♥♥♥';
      overlay.classList.add('hidden');
      gameActive = true;
      requestAnimationFrame(gameLoop);
    }

    function fireLaser() {
      bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 14, speed: 10, color: '#f472b6' });
      // Muzzle sparks
      for (let i = 0; i < 4; i++) {
        particles.push({
          x: player.x + player.width / 2,
          y: player.y,
          vx: (Math.random() - 0.5) * 3,
          vy: Math.random() * 2 + 1,
          life: 12,
          color: '#ec4899'
        });
      }
    }

    function spawnEnemy() {
      const size = 28 + Math.random() * 16;
      enemies.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        width: size,
        height: size,
        speed: 1.8 + Math.random() * 2.2 + (score / 1000),
        color: ['#06b6d4', '#a855f7', '#3b82f6', '#f59e0b'][Math.floor(Math.random() * 4)],
        hp: Math.random() > 0.8 ? 2 : 1
      });
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 30 + Math.random() * 15,
          color
        });
      }
    }

    function gameOver() {
      gameActive = false;
      overlayTitle.innerText = 'SECTOR DEFENDED (GAME OVER)';
      overlaySub.innerText = `Final Score: ${score} Points! Excellent piloting skills, Commander.`;
      document.getElementById('startBtn').innerText = '↺ PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    function gameLoop(timestamp) {
      if (!gameActive) return;

      // Handle keyboard movement
      if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

      // Clear Canvas
      ctx.fillStyle = '#050714';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Starfield background
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      for (let i = 0; i < 30; i++) {
        const sx = (i * 97 + timestamp * 0.05) % canvas.width;
        const sy = (i * 71 + timestamp * 0.2) % canvas.height;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      // Draw Player Ship
      ctx.save();
      ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
      ctx.fillStyle = '#ec4899';
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(16, 16);
      ctx.lineTo(0, 10);
      ctx.lineTo(-16, 16);
      ctx.closePath();
      ctx.fill();
      // Cockpit glow
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(0, -2, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Update & Draw Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= b.speed;
        ctx.fillStyle = b.color;
        ctx.shadowColor = '#ec4899';
        ctx.shadowBlur = 8;
        ctx.fillRect(b.x, b.y, b.width, b.height);
        ctx.shadowBlur = 0;
        if (b.y < -10) bullets.splice(i, 1);
      }

      // Spawn Enemies
      if (timestamp - lastEnemySpawn > 900 - Math.min(score / 5, 500)) {
        spawnEnemy();
        lastEnemySpawn = timestamp;
      }

      // Update & Draw Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;

        ctx.fillStyle = e.color;
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(e.x + e.width / 2, e.y + e.height);
        ctx.lineTo(e.x + e.width, e.y);
        ctx.lineTo(e.x, e.y);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;

        // Bullet Collision
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x < e.x + e.width && b.x + b.width > e.x && b.y < e.y + e.height && b.y + b.height > e.y) {
            bullets.splice(j, 1);
            e.hp--;
            if (e.hp <= 0) {
              createExplosion(e.x + e.width / 2, e.y + e.height / 2, e.color);
              enemies.splice(i, 1);
              score += 100;
              scoreEl.innerText = score.toLocaleString();
              break;
            }
          }
        }

        // Player Collision or Passed Bottom
        if (e && e.y + e.height > player.y && e.x < player.x + player.width && e.x + e.width > player.x) {
          createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#ef4444');
          enemies.splice(i, 1);
          lives--;
          livesEl.innerText = '♥'.repeat(Math.max(0, lives));
          if (lives <= 0) {
            gameOver();
            return;
          }
        } else if (e && e.y > canvas.height + 20) {
          enemies.splice(i, 1);
        }
      }

      // Update & Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 30);
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1.0;
        if (p.life <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
