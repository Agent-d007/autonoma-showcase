<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Lumina Smile Studio - Gentle Family Dentistry</title>
</head>
<body class="font-sans text-slate-800 bg-slate-50 antialiased min-h-screen flex flex-col">
  <header class="bg-white border-b border-slate-100 sticky top-0 z-30 shadow-xs">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-sky-600 text-white flex items-center justify-center font-bold text-lg">L</div>
        <span class="font-extrabold text-lg text-slate-900">Lumina Smile Studio</span>
      </div>
      <button onclick="alert('Booking Portal: Select Date & Time')" class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">Book Appointment</button>
    </div>
  </header>
  <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-12">
    <div class="grid md:grid-cols-2 gap-8 items-center">
      <div>
        <span class="text-xs uppercase font-bold text-sky-600 tracking-wider block mb-2">Modern Care Studio</span>
        <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight mb-4">Gentle Dental Care for the Whole Family.</h1>
        <p class="text-slate-600 text-sm leading-relaxed mb-6">Enjoy pain-free ultrasonic checkups, 3D low-radiation scans, and custom Invisalign smile designs.</p>
        <button onclick="alert('Appointment Slot Selected!')" class="bg-sky-600 text-white text-xs font-bold px-6 py-3.5 rounded-xl shadow-md hover:bg-sky-700 transition">Schedule Free Consultation</button>
      </div>
      <div class="rounded-2xl overflow-hidden shadow-xl border border-slate-200">
        <img src="https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=800&q=80" alt="Clinic" class="w-full aspect-4/3 object-cover" />
      </div>
    </div>
  </main>
</body>
</html>
