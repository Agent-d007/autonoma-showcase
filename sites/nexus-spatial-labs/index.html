<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Spatial Labs - Interactive 3D & Spatial Audio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">
  <header class="sticky top-0 z-40 bg-slate-950/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-black text-white text-base">✦</div>
        <span class="font-extrabold text-lg text-white">Nexus Spatial Labs</span>
      </div>
      <button onclick="alert('SDK Download Initiated!')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition">
        Download 3D SDK
      </button>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-6 py-12 flex-1 w-full">
    <div class="grid lg:grid-cols-12 gap-8 items-center mb-12">
      <div class="lg:col-span-6">
        <span class="text-xs uppercase font-bold text-indigo-400 tracking-wider block mb-2">Three.js 3D Engine Active</span>
        <h1 class="text-4xl sm:text-5xl font-black text-white tracking-tight mb-4">Spatial Computing Engineered for the Next Web.</h1>
        <p class="text-slate-300 text-sm leading-relaxed mb-6">Interact with our real-time 3D Torus Knot spatial audio harmonic model. Drag to rotate in 360° space.</p>
      </div>
      <div class="lg:col-span-6 relative rounded-3xl overflow-hidden border-2 border-indigo-500/40 shadow-2xl aspect-[16/10] bg-slate-950">
        <div id="nexusThreeContainer" class="w-full h-full cursor-grab"></div>
      </div>
    </div>
  </main>
  <script>
    function initNexusThree() {
      const container = document.getElementById('nexusThreeContainer');
      if (!container || typeof THREE === 'undefined') return;
      const w = container.clientWidth || 500;
      const h = container.clientHeight || 320;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
      camera.position.z = 4.8;
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(w, h);
      container.appendChild(renderer.domElement);
      const geo = new THREE.TorusKnotGeometry(1.1, 0.32, 128, 32);
      const mat = new THREE.MeshStandardMaterial({ color: 0x6366f1, wireframe: true, roughness: 0.2 });
      const mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);
      const light = new THREE.PointLight(0xffffff, 2, 20);
      light.position.set(5, 5, 5);
      scene.add(light);
      function anim() {
        requestAnimationFrame(anim);
        mesh.rotation.y += 0.01;
        mesh.rotation.x += 0.005;
        renderer.render(scene, camera);
      }
      anim();
    }
    window.addEventListener('DOMContentLoaded', initNexusThree);
    setTimeout(initNexusThree, 300);
  </script>
</body>
</html>
