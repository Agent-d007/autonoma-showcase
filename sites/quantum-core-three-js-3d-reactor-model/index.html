<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Core: Interactive 3D Three.js Model</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4 selection:bg-cyan-500 selection:text-black">
  <div class="max-w-5xl w-full">
    <!-- Header -->
    <header class="flex justify-between items-center mb-4 bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-cyan-500/30">
          🧊
        </div>
        <div>
          <h1 class="font-black text-xl tracking-tight text-white flex items-center gap-2">
            QUANTUM CORE <span class="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">Three.js 3D Mesh</span>
          </h1>
          <p class="text-xs text-slate-400">Click & Drag to Orbit 360° • Scroll to Zoom • Toggle Shaders in Real-Time</p>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="toggleWireframe()" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-cyan-500/30 px-3.5 py-2 rounded-xl text-xs font-bold transition">
          🕸️ <span id="wireframeText">Wireframe: ON</span>
        </button>
        <button onclick="cycleColorTheme()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-extrabold transition">
          🎨 Theme: <span id="themeText">Cyan Pulse</span>
        </button>
      </div>
    </header>

    <!-- 3D Three.js WebGL Container -->
    <div class="relative rounded-3xl overflow-hidden border-2 border-cyan-500/40 shadow-2xl aspect-[16/9] w-full bg-slate-950">
      <div id="threeContainer" class="w-full h-full cursor-grab active:cursor-grabbing"></div>
      
      <!-- Live 3D Telemetry HUD -->
      <div class="absolute bottom-4 left-4 bg-slate-900/90 backdrop-blur border border-slate-800 p-3 rounded-xl flex gap-6 text-[11px] font-mono text-slate-300">
        <div><span class="text-cyan-400 font-bold">VERTICES:</span> 4,096</div>
        <div><span class="text-cyan-400 font-bold">PARTICLES:</span> 800 Dust</div>
        <div><span class="text-cyan-400 font-bold">RENDER:</span> WebGL2 60FPS</div>
      </div>

      <div class="absolute bottom-4 right-4 flex gap-2">
        <button onclick="adjustSpeed(0.5)" class="bg-slate-900/80 border border-slate-800 hover:border-cyan-400 text-xs px-3 py-1.5 rounded-lg text-slate-300">0.5x</button>
        <button onclick="adjustSpeed(1.0)" class="bg-slate-900/80 border border-slate-800 hover:border-cyan-400 text-xs px-3 py-1.5 rounded-lg text-slate-300">1.0x</button>
        <button onclick="adjustSpeed(2.5)" class="bg-slate-900/80 border border-slate-800 hover:border-cyan-400 text-xs px-3 py-1.5 rounded-lg text-slate-300">2.5x</button>
      </div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, coreMesh, outerRing, particlePoints;
    let isWireframe = true;
    let rotSpeed = 0.01;
    let themeIndex = 0;
    const themes = [
      { name: 'Cyan Pulse', core: 0x06b6d4, ring: 0x3b82f6, particles: 0x67e8f9 },
      { name: 'Neon Violet', core: 0xa855f7, ring: 0xec4899, particles: 0xf472b6 },
      { name: 'Solar Amber', core: 0xf59e0b, ring: 0xef4444, particles: 0xfde047 },
      { name: 'Emerald Flux', core: 0x10b981, ring: 0x059669, particles: 0x6ee7b7 }
    ];

    function init3D() {
      const container = document.getElementById('threeContainer');
      const width = container.clientWidth || 800;
      const height = container.clientHeight || 450;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.z = 5.5;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Core Geometry (Icosahedron / Quantum Crystal)
      const coreGeo = new THREE.IcosahedronGeometry(1.3, 2);
      const coreMat = new THREE.MeshStandardMaterial({
        color: themes[0].core,
        wireframe: true,
        metalness: 0.8,
        roughness: 0.2
      });
      coreMesh = new THREE.Mesh(coreGeo, coreMat);
      scene.add(coreMesh);

      // Outer Torus Gyro Ring
      const ringGeo = new THREE.TorusGeometry(2.0, 0.04, 16, 100);
      const ringMat = new THREE.MeshBasicMaterial({ color: themes[0].ring, wireframe: false });
      outerRing = new THREE.Mesh(ringGeo, ringMat);
      scene.add(outerRing);

      // Particle Nebula
      const pCount = 800;
      const pGeo = new THREE.BufferGeometry();
      const pos = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount * 3; i += 3) {
        pos[i] = (Math.random() - 0.5) * 8;
        pos[i+1] = (Math.random() - 0.5) * 8;
        pos[i+2] = (Math.random() - 0.5) * 8;
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const pMat = new THREE.PointsMaterial({ size: 0.035, color: themes[0].particles, transparent: true, opacity: 0.75 });
      particlePoints = new THREE.Points(pGeo, pMat);
      scene.add(particlePoints);

      // Lighting
      const light1 = new THREE.PointLight(0xffffff, 2, 20);
      light1.position.set(5, 5, 5);
      scene.add(light1);
      const light2 = new THREE.PointLight(themes[0].core, 3, 20);
      light2.position.set(-5, -5, -5);
      scene.add(light2);

      // Mouse Drag Orbit
      let isDragging = false;
      let prevMouse = { x: 0, y: 0 };
      container.addEventListener('mousedown', (e) => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
      window.addEventListener('mouseup', () => { isDragging = false; });
      container.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevMouse.x;
        const dy = e.clientY - prevMouse.y;
        coreMesh.rotation.y += dx * 0.008;
        coreMesh.rotation.x += dy * 0.008;
        outerRing.rotation.y += dx * 0.008;
        outerRing.rotation.x += dy * 0.008;
        prevMouse = { x: e.clientX, y: e.clientY };
      });

      function animate() {
        requestAnimationFrame(animate);
        coreMesh.rotation.y += rotSpeed;
        coreMesh.rotation.x += rotSpeed * 0.6;
        outerRing.rotation.x += rotSpeed * 1.4;
        outerRing.rotation.z += rotSpeed * 0.8;
        particlePoints.rotation.y -= rotSpeed * 0.3;
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });
    }

    function toggleWireframe() {
      isWireframe = !isWireframe;
      coreMesh.material.wireframe = isWireframe;
      document.getElementById('wireframeText').innerText = 'Wireframe: ' + (isWireframe ? 'ON' : 'OFF');
    }

    function adjustSpeed(val) {
      rotSpeed = 0.01 * val;
    }

    function cycleColorTheme() {
      themeIndex = (themeIndex + 1) % themes.length;
      const t = themes[themeIndex];
      coreMesh.material.color.setHex(t.core);
      outerRing.material.color.setHex(t.ring);
      particlePoints.material.color.setHex(t.particles);
      document.getElementById('themeText').innerText = t.name;
    }

    window.addEventListener('DOMContentLoaded', init3D);
    setTimeout(init3D, 200);
  </script>
</body>
</html>
