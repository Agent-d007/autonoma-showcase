<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>FlowState Reformer & Yoga</title>
</head>
<body class="bg-orange-50/40 text-stone-800 font-sans antialiased">
  <header class="bg-white/80 backdrop-blur sticky top-0 z-20 border-b border-orange-100">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="font-black tracking-tight text-orange-900 text-lg">FLOWSTATE <span class="text-orange-600 text-xs font-semibold uppercase tracking-widest block">Studio & Sauna</span></div>
      <div class="flex items-center gap-4 text-xs font-semibold">
        <a href="#schedule" class="text-stone-600 hover:text-orange-600">Schedule</a>
        <a href="#pricing" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-full transition">Intro Offer $49</a>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-16 text-center">
    <span class="inline-block bg-orange-100 text-orange-800 text-xs font-bold px-3 py-1 rounded-full mb-4">First 3 Classes for $49 • Mat & Towel Included</span>
    <h1 class="text-4xl lg:text-5xl font-extrabold text-stone-900 mb-6">Sculpt Intentional Strength & Deep Mobility.</h1>
    <p class="text-stone-600 max-w-xl mx-auto mb-8 text-sm leading-relaxed">State-of-the-art Allegro 2 Reformers, infrared heated studios, and compassionate certified instructors in downtown Austin.</p>
    <div class="flex justify-center gap-4 text-sm font-semibold">
      <button class="bg-orange-600 hover:bg-orange-700 text-white px-6 py-3 rounded-full shadow-md transition" onclick="alert('Intro pass selected! Proceeding to pass checkout.')">Book First Class</button>
      <a href="#schedule" class="bg-white border border-stone-200 px-6 py-3 rounded-full text-stone-700 hover:bg-stone-50 transition">View Class Schedule</a>
    </div>
  </main>
</body>
</html>
