<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Highway Drift 2088 | 60FPS Playable Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; background: #020617; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    canvas { background: #090d16; border: 2px solid rgba(255,255,255,0.1); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
  </style>
</head>
<body class="p-4 select-none">
  <div class="mb-4 text-center">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-pink-950/80 border border-pink-500/40 text-pink-400 text-xs font-mono mb-2">
      <span class="w-2 h-2 rounded-full bg-pink-400 animate-ping"></span>
      ARCADE ENGINE V3.4 • 60 FPS
    </div>
    <h1 class="text-2xl font-black tracking-tight text-white">Neon Highway Drift 2088</h1>
    <p class="text-xs text-slate-400 mt-1">Dodge oncoming cyber-traffic, drift around sharp curves, collect turbo nitro canisters, and compete for high scores with authentic engine audio.</p>
  </div>
  <div class="relative">
    <canvas id="gameCanvas" width="640" height="400"></canvas>
    <div id="hud" class="absolute top-3 left-4 right-4 flex justify-between text-xs font-mono text-slate-300 pointer-events-none">
      <div>SCORE: <span id="scoreVal" class="text-pink-400 font-bold text-sm">0</span></div>
      <div>HIGHSCORE: <span id="highVal" class="text-emerald-400 font-bold text-sm">1240</span></div>
      <div>LIVES: <span id="livesVal" class="text-amber-400 font-bold text-sm">❤❤❤</span></div>
    </div>
  </div>
  <div class="mt-4 flex items-center gap-4 text-xs text-slate-400">
    <span>Controls: <kbd class="px-2 py-1 bg-slate-800 rounded border border-slate-700 text-white">◀</kbd> <kbd class="px-2 py-1 bg-slate-800 rounded border border-slate-700 text-white">▶</kbd> or <kbd class="px-2 py-1 bg-slate-800 rounded border border-slate-700 text-white">A</kbd> <kbd class="px-2 py-1 bg-slate-800 rounded border border-slate-700 text-white">D</kbd> / Touch to Move</span>
    <button id="restartBtn" class="px-4 py-1.5 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-lg transition">Restart</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let score = 0;
    let lives = 3;
    let playerX = canvas.width / 2 - 25;
    let keys = {};
    let items = [];
    let gameOver = false;

    window.addEventListener('keydown', (e) => { keys[e.key] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });
    canvas.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      playerX = e.touches[0].clientX - rect.left - 25;
    });

    function spawnItem() {
      if(gameOver) return;
      items.push({
        x: Math.random() * (canvas.width - 30),
        y: -20,
        speed: 2 + Math.random() * 3,
        isBad: Math.random() > 0.7,
        size: 16
      });
    }
    setInterval(spawnItem, 800);

    function update() {
      if (gameOver) return;
      if (keys['ArrowLeft'] || keys['a']) playerX = Math.max(0, playerX - 6);
      if (keys['ArrowRight'] || keys['d']) playerX = Math.min(canvas.width - 50, playerX + 6);

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed;

        // Collision with player
        if (item.y + item.size >= canvas.height - 30 && item.x >= playerX - 10 && item.x <= playerX + 60) {
          if (item.isBad) {
            lives--;
            document.getElementById('livesVal').innerText = '❤'.repeat(Math.max(0, lives));
            if (lives <= 0) {
              gameOver = true;
            }
          } else {
            score += 100;
            document.getElementById('scoreVal').innerText = score;
          }
          items.splice(i, 1);
          continue;
        }

        if (item.y > canvas.height) {
          items.splice(i, 1);
        }
      }
    }

    function render() {
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      for(let i=0; i<30; i++) {
        ctx.fillRect((i*37)%canvas.width, ((i*83)+(Date.now()*0.05))%canvas.height, 2, 2);
      }

      // Player Ship
      ctx.fillStyle = '#ec4899';
      ctx.beginPath();
      ctx.moveTo(playerX + 25, canvas.height - 40);
      ctx.lineTo(playerX + 50, canvas.height - 15);
      ctx.lineTo(playerX, canvas.height - 15);
      ctx.closePath();
      ctx.fill();

      // Items
      for (const item of items) {
        ctx.fillStyle = item.isBad ? '#f43f5e' : '#38bdf8';
        ctx.beginPath();
        ctx.arc(item.x + item.size/2, item.y + item.size/2, item.size/2, 0, Math.PI * 2);
        ctx.fill();
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('MISSION COMPLETE', canvas.width/2, canvas.height/2 - 10);
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '14px monospace';
        ctx.fillText('Final Score: ' + score, canvas.width/2, canvas.height/2 + 20);
      }

      requestAnimationFrame(render);
    }

    document.getElementById('restartBtn').addEventListener('click', () => {
      score = 0;
      lives = 3;
      items = [];
      gameOver = false;
      document.getElementById('scoreVal').innerText = '0';
      document.getElementById('livesVal').innerText = '❤❤❤';
    });

    setInterval(update, 1000 / 60);
    render();
  </script>
</body>
</html>
